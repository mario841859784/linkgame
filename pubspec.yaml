name: link_game
description: 连连看消除游戏 - 适老化与无障碍设计
publish_to: 'none'
version: 1.2.0+8

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.5.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  flutter_tts: ^4.0.2
  http: ^1.5.0
  path_provider: ^2.1.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  archive: ^4.6.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
